name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest build
      - run: python -m pytest -q
      - run: python -m build --wheel
      - name: Install built wheel into a clean venv and verify it's importable as pixctl
        run: |
          python -m venv /tmp/pixctl-install-check
          /tmp/pixctl-install-check/bin/pip install dist/*.whl
          /tmp/pixctl-install-check/bin/python -c "import pixctl; print('pixctl OK:', pixctl.__file__)"
